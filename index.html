<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          const desc = {
            configurable: true,
            enumerable: true,
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; }
          };
          try { Object.defineProperty(window, 'fetch', desc); } catch (e) {}
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'fetch', desc);
            }
          } catch (e) {}
        } catch (e) {}

        // Suppress Chrome extension script injection errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && event.message.includes('Cannot set property fetch'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
